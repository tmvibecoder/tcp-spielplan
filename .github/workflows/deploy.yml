name: Deploy to Hetzner

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner server (web01)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/tcp-spielplan.de
            # Hart auf den aktuellen main-Stand synchronisieren.
            # 'git pull' scheiterte bisher still, wenn lokale Aenderungen
            # (z.B. an package-lock.json durch npm install) im Weg waren –
            # der alte Code wurde dann unbemerkt neu gebaut.
            git fetch origin main
            git reset --hard origin/main
            BUILT_COMMIT="$(git rev-parse --short HEAD)"
            # Deterministische, reproduzierbare Installation (veraendert package-lock.json nicht).
            npm ci
            npm run build
            # Sicherstellen, dass wirklich neu gebaut wurde.
            test -d dist/assets
            echo "Deployment of $BUILT_COMMIT completed at $(date)"
